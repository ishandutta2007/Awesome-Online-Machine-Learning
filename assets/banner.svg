<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>

    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="streamGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0f2fe"/>
      <stop offset="75%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25"/>
    </pattern>

    <style>
      @keyframes streamFlow {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes streamFlowRev {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 400; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.08); }
      }
      @keyframes driftOrbit {
        0% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-8px) translateX(5px); }
        100% { transform: translateY(0px) translateX(0px); }
      }
      @keyframes particleFloat {
        0% { cx: 40; opacity: 0.2; }
        50% { opacity: 1; }
        100% { cx: 920; opacity: 0.1; }
      }
      .stream-line-1 {
        stroke-dasharray: 20, 15;
        animation: streamFlow 12s linear infinite;
      }
      .stream-line-2 {
        stroke-dasharray: 12, 18;
        animation: streamFlowRev 15s linear infinite;
      }
      .stream-line-3 {
        stroke-dasharray: 25, 20;
        animation: streamFlow 18s linear infinite;
      }
      .pulsing-node {
        transform-origin: center;
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .drifting-element {
        animation: driftOrbit 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="960" height="280" rx="16" fill="url(#bgGradient)"/>
  <rect width="960" height="280" rx="16" fill="url(#gridPattern)"/>

  <!-- ================= BACKGROUND DYNAMIC / STREAMING LAYER ================= -->
  <g class="bg-effects">
    <!-- Ambient glowing backdrop blobs -->
    <circle cx="150" cy="70" r="120" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
    <circle cx="820" cy="200" r="140" fill="#818cf8" opacity="0.08" filter="url(#glow)"/>
    <circle cx="500" cy="140" r="160" fill="#c084fc" opacity="0.05" filter="url(#glow)"/>

    <!-- Dynamic Streaming Data Paths -->
    <path class="stream-line-1" d="M -20,60 C 220,20 380,110 560,50 C 720,-5 820,90 980,60" fill="none" stroke="url(#streamGrad1)" stroke-width="2.5" opacity="0.7"/>
    <path class="stream-line-2" d="M -20,210 C 200,240 360,160 520,220 C 700,280 840,190 980,225" fill="none" stroke="url(#streamGrad2)" stroke-width="2" opacity="0.6"/>
    <path class="stream-line-3" d="M -20,135 C 180,95 340,185 580,120 C 740,70 860,165 980,135" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.4"/>

    <!-- Streaming Data Packet Nodes (Side & Perimeter - Not obscuring center) -->
    <g class="drifting-element">
      <circle cx="110" cy="60" r="5" fill="#38bdf8" filter="url(#nodeGlow)"/>
      <circle cx="210" cy="95" r="4" fill="#818cf8" opacity="0.75"/>
      <circle cx="70" cy="190" r="4.5" fill="#34d399" opacity="0.7"/>
      <line x1="70" y1="190" x2="110" y2="230" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
      <circle cx="110" cy="230" r="3.5" fill="#38bdf8" opacity="0.6"/>
    </g>

    <g class="drifting-element" style="animation-delay: -3s;">
      <circle cx="860" cy="80" r="5" fill="#c084fc" filter="url(#nodeGlow)"/>
      <circle cx="910" cy="150" r="4" fill="#38bdf8" opacity="0.7"/>
      <circle cx="830" cy="210" r="4.5" fill="#818cf8" opacity="0.8"/>
      <line x1="860" y1="80" x2="910" y2="150" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
    </g>

    <!-- Animated Data Particles Streaming Across Bottom Line -->
    <circle cx="0" cy="255" r="2.5" fill="#38bdf8">
      <animate attributeName="cx" from="20" to="940" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="25" r="2.5" fill="#818cf8">
      <animate attributeName="cx" from="940" to="20" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================= FOREGROUND HERO CARD & LABELS ================= -->
  <!-- Frosted card overlay ensuring foreground text stands out with absolute legibility -->
  <g id="foreground-hero">
    <rect x="70" y="32" width="820" height="216" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.35"/>

    <!-- Subtle inner border for refined UI aesthetic -->
    <rect x="73" y="35" width="814" height="210" rx="11" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.08"/>

    <!-- Top Category Pill / Badge -->
    <g transform="translate(355, 52)">
      <rect x="0" y="0" width="250" height="26" rx="13" fill="#0369a1" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
      <text x="125" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#7dd3fc" text-anchor="middle" letter-spacing="1.5">REAL-TIME STREAMING ML ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="480" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" fill="url(#titleGrad)" text-anchor="middle" letter-spacing="0.5">
      Awesome Online Machine Learning
    </text>

    <!-- Subtitle -->
    <text x="480" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.3">
      Streaming Data Pipelines <tspan fill="#38bdf8">•</tspan> Concept Drift Adaptation <tspan fill="#818cf8">•</tspan> Incremental Learning
    </text>

    <!-- Interactive Features Pill Grid in Foreground -->
    <g transform="translate(145, 186)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="0.8"/>
        <text x="90" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">⚡ Single-Instance Fit</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(195, 0)">
        <rect width="190" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="0.8"/>
        <text x="95" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">🔄 Drift Detectors</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(400, 0)">
        <rect width="190" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="0.8"/>
        <text x="95" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">🧠 Catastrophic Memory Bounds</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(605, 0)">
        <rect width="65" height="34" rx="8" fill="#3b82f6" fill-opacity="0.25" stroke="#60a5fa" stroke-width="1"/>
        <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" text-anchor="middle">2026</text>
      </g>
    </g>
  </g>
</svg>
